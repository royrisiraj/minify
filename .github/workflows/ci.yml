name: Application CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: testing
      DEBUG: "false"
      DATABASE_URL: postgresql+psycopg://minify_test:minify_test@localhost:5432/minify_test
      TEST_DATABASE_URL: postgresql+psycopg://minify_test:minify_test@localhost:5432/minify_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: minify_test
          POSTGRES_PASSWORD: minify_test
          POSTGRES_DB: minify_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U minify_test -d minify_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: python -m pip check
      - run: ruff check .
      - run: ruff format --check .
      - run: ruff check ../infrastructure
      - run: ruff format --check ../infrastructure
      - run: alembic upgrade head
      - run: alembic current
      - run: alembic heads
      - run: pytest -m "not integration"
      - run: pytest -m integration

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 120
      - run: docker compose exec -T backend python -m alembic upgrade head
      - run: >-
          docker compose exec -T backend python -c
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=10)"
      - run: curl --fail http://localhost:5173
      - run: python3 infrastructure/verify_stack.py create
      - name: Verify database persistence across normal shutdown
        run: |
          docker compose down
          docker compose up -d --wait --wait-timeout 120
          python3 infrastructure/verify_stack.py verify
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down
